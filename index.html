<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>話題のくじ ｜ 雑談が盛り上がる100の問いかけ</title>
<style>
:root{
  --ink:#241812;
  --ink-2:#3A2A1E;
  --leather:#4A3428;
  --leather-hi:#5A4132;
  --cream:#F5EFE6;
  --muted:#A88E76;
  --gold:#C9A227;
  --gold-hi:#E7CE84;
  --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","MS PMincho",serif;
  --gothic:"Hiragino Sans","Yu Gothic","Meiryo",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  padding:clamp(20px,5vw,56px) clamp(16px,4vw,32px) 72px;
  background:
    radial-gradient(120% 80% at 50% 0%, #4A3325 0%, rgba(74,51,37,0) 60%),
    linear-gradient(180deg,var(--ink-2) 0%, var(--ink) 100%);
  background-attachment:fixed;
  color:var(--cream);
  font-family:var(--gothic);
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
}
.stage{max-width:760px;margin:0 auto;position:relative;z-index:1}

/* ---- header ---- */
.masthead{text-align:center;margin-bottom:clamp(24px,5vw,44px)}
.masthead h1{
  font-family:var(--mincho);font-weight:600;
  font-size:clamp(28px,7vw,44px);letter-spacing:.4em;text-indent:.4em;
  margin:0 0 14px;color:var(--cream);
}
.rule{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--gold)}
.rule i{display:block;width:min(120px,22vw);height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.rule i+i{background:linear-gradient(90deg,var(--gold),transparent)}
.rule b{font-size:9px;letter-spacing:.05em}
.masthead p{
  margin:14px 0 0;font-family:var(--mincho);color:var(--muted);
  font-size:clamp(12px,3vw,14px);letter-spacing:.22em;
}

/* ---- filters ---- */
.filters{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-bottom:clamp(22px,4vw,34px)}
.filters button{
  font-family:var(--gothic);font-size:11.5px;letter-spacing:.06em;
  color:var(--muted);background:transparent;
  border:1px solid rgba(201,162,39,.28);border-radius:999px;
  padding:7px 14px;cursor:pointer;transition:.25s ease;
}
.filters button:hover{color:var(--cream);border-color:rgba(201,162,39,.6)}
.filters button[aria-pressed="true"]{
  color:var(--ink);background:linear-gradient(180deg,var(--gold-hi),var(--gold));
  border-color:var(--gold-hi);font-weight:600;
}

/* ---- the box ---- */
.box{position:relative;margin-bottom:clamp(24px,4vw,34px)}
.box-frame{
  position:relative;overflow:hidden;
  min-height:clamp(210px,42vw,270px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;padding:clamp(30px,6vw,48px) clamp(24px,7vw,64px);
  background:
    linear-gradient(160deg,var(--leather-hi) 0%,var(--leather) 45%,#3B2921 100%);
  border:1px solid rgba(201,162,39,.34);
  border-radius:3px;
  box-shadow:
    inset 0 1px 0 rgba(255,240,215,.09),
    inset 0 0 60px rgba(0,0,0,.42),
    0 24px 50px -22px rgba(0,0,0,.85);
}
.box-frame::after{
  content:"";position:absolute;inset:9px;border:1px solid rgba(201,162,39,.16);
  border-radius:1px;pointer-events:none;
}
.corner{position:absolute;width:16px;height:16px;border:1px solid var(--gold);opacity:.62;pointer-events:none}
.corner.tl{top:16px;left:16px;border-right:0;border-bottom:0}
.corner.tr{top:16px;right:16px;border-left:0;border-bottom:0}
.corner.bl{bottom:16px;left:16px;border-right:0;border-top:0}
.corner.br{bottom:16px;right:16px;border-left:0;border-top:0}

.cat{
  font-size:10.5px;letter-spacing:.3em;text-indent:.3em;color:var(--gold);
  min-height:15px;opacity:.9;transition:opacity .3s;
}
.theme{
  font-family:var(--mincho);font-weight:500;
  font-size:clamp(19px,5.2vw,28px);line-height:1.85;letter-spacing:.05em;
  text-align:center;color:var(--cream);
  text-shadow:0 2px 14px rgba(0,0,0,.45);
  transition:filter .18s ease, opacity .18s ease;
}
.box-frame.is-drawing .theme{filter:blur(.6px);opacity:.72}
.box-frame.is-drawing .cat{opacity:.45}
.box-frame.is-settled .theme{animation:settle .7s cubic-bezier(.16,1,.3,1) both}
@keyframes settle{
  0%{transform:scale(.94);opacity:.4;filter:blur(3px)}
  100%{transform:scale(1);opacity:1;filter:blur(0)}
}
.glow{
  position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;
  border:1px solid var(--gold-hi);border-radius:50%;opacity:0;pointer-events:none;
}
.box-frame.is-settled .glow{animation:burst .95s cubic-bezier(.2,.8,.2,1) both}
@keyframes burst{
  0%{transform:scale(.2);opacity:.9;box-shadow:0 0 60px 20px rgba(231,206,132,.35)}
  100%{transform:scale(5.5);opacity:0;box-shadow:0 0 0 0 rgba(231,206,132,0)}
}
.spine{
  position:absolute;top:50%;right:-13px;transform:translateY(-50%);
  writing-mode:vertical-rl;font-family:var(--mincho);
  font-size:11px;letter-spacing:.42em;
  color:var(--ink);background:linear-gradient(180deg,var(--gold-hi),var(--gold));
  padding:14px 5px;border-radius:1px;
  box-shadow:0 6px 16px -6px rgba(0,0,0,.8);
}

/* ---- action ---- */
.action{display:flex;flex-direction:column;align-items:center;gap:14px}
.draw{
  font-family:var(--mincho);font-size:clamp(15px,3.6vw,17px);letter-spacing:.34em;text-indent:.34em;
  color:var(--ink);background:linear-gradient(180deg,var(--gold-hi) 0%,var(--gold) 60%,#A9831C 100%);
  border:0;border-radius:2px;padding:16px clamp(34px,9vw,60px);cursor:pointer;
  box-shadow:0 12px 26px -14px rgba(201,162,39,.85), inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
}
.draw:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 18px 32px -14px rgba(201,162,39,.95), inset 0 1px 0 rgba(255,255,255,.4)}
.draw:active:not(:disabled){transform:translateY(0)}
.draw:disabled{filter:saturate(.35) brightness(.72);cursor:not-allowed}
.meta{font-size:11px;letter-spacing:.16em;color:var(--muted)}
.meta em{font-style:normal;color:var(--gold-hi)}

/* ---- history ---- */
.history{margin-top:clamp(40px,8vw,64px)}
.history h2{
  font-family:var(--mincho);font-weight:500;font-size:12px;letter-spacing:.34em;text-indent:.34em;
  color:var(--muted);text-align:center;margin:0 0 18px;
}
.history ol{list-style:none;margin:0;padding:0;border-top:1px solid rgba(201,162,39,.14)}
.history li{
  display:flex;gap:14px;align-items:baseline;
  padding:11px 4px;border-bottom:1px solid rgba(201,162,39,.14);
  font-size:13px;line-height:1.7;color:rgba(245,239,230,.82);
  animation:fadein .45s ease both;
}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.history .no{font-family:var(--mincho);font-size:11px;color:var(--gold);opacity:.75;min-width:22px}
.history .tag{font-size:10px;color:var(--muted);letter-spacing:.08em;white-space:nowrap}
.history .empty{color:var(--muted);font-size:12px;justify-content:center;border-bottom:0}

:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
@media (max-width:420px){
  .spine{display:none}
  .box-frame{padding-left:20px;padding-right:20px}
}
</style>
</head>
<body>
<main class="stage">
  <header class="masthead">
    <h1>話題のくじ</h1>
    <div class="rule"><i></i><b>◆</b><i></i></div>
    <p>雑談が盛り上がる、百の問いかけ</p>
  </header>

  <nav class="filters" id="filters" aria-label="カテゴリを選ぶ"></nav>

  <div class="box">
    <div class="box-frame" id="frame">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
      <span class="glow"></span>
      <p class="cat" id="cat">&nbsp;</p>
      <p class="theme" id="theme" aria-live="polite">くじを引くと話題が決まります</p>
    </div>
    <div class="spine">話題</div>
  </div>

  <div class="action">
    <button class="draw" id="draw" type="button">くじを引く</button>
    <p class="meta" id="meta"></p>
  </div>

  <section class="history">
    <h2>これまでの話題</h2>
    <ol id="hist"><li class="empty">まだ引いていません</li></ol>
  </section>
</main>

<script>
// トークテーマ 100個（10カテゴリ × 10個）
// 500問から「盛り上がりやすい」ものを厳選
// 雑談が盛り上がるくじ引きアプリ用データ

const THEME_DATA = [
  {
    category: "自己紹介・その人らしさ",
    themes: [
      "最近ハマっていることは何ですか？",
      "自分を動物にたとえると何だと思いますか？",
      "初対面の人によく言われる第一印象は？",
      "人には言わないけど密かに得意なことは？",
      "スマホのホーム画面は何の写真ですか？",
      "最近買ってよかったものは何ですか？",
      "学生時代のあだ名は何でしたか？",
      "人生で一番お金をかけたものは何ですか？",
      "部屋を見たらどんな人だと思われそうですか？",
      "最近笑ったのはどんな出来事でしたか？"
    ]
  },
  {
    category: "食べ物・お店",
    themes: [
      "最後の晩餐に選ぶ一皿は何ですか？",
      "人生で一番おいしかった食べ物は何ですか？",
      "コンビニで必ず買ってしまうものは？",
      "カレーの具で外せない具材は何ですか？",
      "深夜に食べたくなるものは何ですか？",
      "お寿司で最初に頼むネタは何ですか？",
      "好きなおにぎりの具を教えてください",
      "意外な組み合わせでおいしい食べ方は？",
      "給食で一番好きだったメニューは何ですか？",
      "実家の味で恋しくなる料理はありますか？"
    ]
  },
  {
    category: "旅行・おでかけ",
    themes: [
      "今まで行った中で一番良かった場所は？",
      "死ぬまでに一度は行きたい国はどこですか？",
      "旅行は計画派ですか、ノープラン派ですか？",
      "旅先でのハプニング体験はありますか？",
      "飛行機では窓側と通路側、どちらですか？",
      "海外で驚いた文化の違いはありますか？",
      "修学旅行はどこへ行きましたか？",
      "泊まるなら旅館とホテル、どちらですか？",
      "遊園地では絶叫系に乗るほうですか？",
      "日帰りで行くならどこへ行きたいですか？"
    ]
  },
  {
    category: "子ども時代・思い出",
    themes: [
      "子どもの頃の夢は何でしたか？",
      "小学生の頃、休み時間は何をしていましたか？",
      "夏休みの宿題は早めに終わらせる派でしたか？",
      "部活動は何をやっていましたか？",
      "好きだった駄菓子は何ですか？",
      "遠足のおやつはいくらまででしたか？",
      "昔怒られて今でも覚えていることは？",
      "子どもの頃に信じていた嘘はありますか？",
      "当時流行っていた遊びやおもちゃは？",
      "学生時代の先生で印象に残る人はいますか？"
    ]
  },
  {
    category: "仕事・働き方",
    themes: [
      "今の仕事を選んだきっかけは何ですか？",
      "仕事で一番やりがいを感じる瞬間は？",
      "初めての給料は何に使いましたか？",
      "学生時代のバイトで学んだことは？",
      "全く違う職業に就くなら何がいいですか？",
      "仕事終わりのご褒美は何ですか？",
      "自分の職種の業界用語を一つ教えてください",
      "在宅と出社、どちらが合っていますか？",
      "仕事で一番緊張した場面は何ですか？",
      "休みが一日増えたら何に使いますか？"
    ]
  },
  {
    category: "趣味・エンタメ",
    themes: [
      "最近見て面白かった映画は何ですか？",
      "カラオケの十八番は何ですか？",
      "推しと呼べる存在はいますか？",
      "今まで一番泣いた作品は何ですか？",
      "繰り返し見てしまう作品はありますか？",
      "一日中やっていられることは何ですか？",
      "好きな作品の名セリフを教えてください",
      "誰かに勧めたい作品はありますか？",
      "昔ハマっていて今はやらない趣味は？",
      "コレクションしている物はありますか？"
    ]
  },
  {
    category: "もしも・空想",
    themes: [
      "宝くじで一億円当たったら何に使いますか？",
      "一日だけ透明人間になれたら何をしますか？",
      "無人島に一つ持っていくなら何ですか？",
      "超能力を一つ持てるなら何がいいですか？",
      "願いが一つだけ叶うなら何を願いますか？",
      "好きな時代へ行けるならいつを選びますか？",
      "自分の人生が映画になったら主演は誰？",
      "一生同じ食事なら何を選びますか？",
      "明日世界が終わるなら今日何をしますか？",
      "自分の店を出すとしたら何屋さんですか？"
    ]
  },
  {
    category: "価値観・ちょっと深い話",
    themes: [
      "幸せを感じるのはどんな瞬間ですか？",
      "一番感謝している人は誰ですか？",
      "自分を変えた本や言葉はありますか？",
      "人生の転機はいつでしたか？",
      "続けていて良かったと思うことは何ですか？",
      "「大人になった」と感じた瞬間は？",
      "自分の機嫌をどうやって取っていますか？",
      "心が落ち着く場所はどこですか？",
      "老後はどんなふうに過ごしたいですか？",
      "良い友人の条件は何だと思いますか？"
    ]
  },
  {
    category: "笑える失敗談・あるある",
    themes: [
      "寝坊してやらかした話はありますか？",
      "人違いをして気まずかった経験は？",
      "電車で寝過ごしてどこまで行きましたか？",
      "送信先を間違えたメールはありますか？",
      "言い間違いで笑われたことはありますか？",
      "傘は今までに何本なくしましたか？",
      "探し物が意外な場所から出てきた話は？",
      "人前で派手に転んだことはありますか？",
      "変換ミスで面白いことになった経験は？",
      "慌てて出かけると何を忘れがちですか？"
    ]
  },
  {
    category: "季節・日常のこと",
    themes: [
      "一年で一番好きな季節はいつですか？",
      "お風呂は朝派ですか、夜派ですか？",
      "冷房と暖房の設定温度は何度ですか？",
      "花火大会に行った思い出はありますか？",
      "年末年始はどう過ごしていますか？",
      "休日の朝は何時に起きますか？",
      "寝る前の習慣はありますか？",
      "雪が降るとどんな気持ちになりますか？",
      "月曜の朝はどんな気分になりますか？",
      "今週楽しみにしていることは何ですか？"
    ]
  }
];

// 全テーマをフラットに使いたい場合
const ALL_THEMES = THEME_DATA.flatMap(g =>
  g.themes.map(t => ({ category: g.category, text: t }))
);
// ALL_THEMES.length === 100


(function(){
  const DURATION = 3500;
  const FAST = 45, SLOW = 400;

  const frame = document.getElementById('frame');
  const catEl = document.getElementById('cat');
  const themeEl = document.getElementById('theme');
  const drawBtn = document.getElementById('draw');
  const metaEl = document.getElementById('meta');
  const histEl = document.getElementById('hist');
  const filtersEl = document.getElementById('filters');

  const used = new Set();
  let filter = 'すべて';
  let history = [];
  let drawing = false;
  let hasDrawn = false;

  const categories = ['すべて', ...THEME_DATA.map(g => g.category)];
  categories.forEach(name => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = name;
    b.setAttribute('aria-pressed', String(name === filter));
    b.addEventListener('click', () => {
      if (drawing) return;
      filter = name;
      [...filtersEl.children].forEach(c =>
        c.setAttribute('aria-pressed', String(c.textContent === filter)));
      updateMeta();
    });
    filtersEl.appendChild(b);
  });

  const inFilter = i =>
    filter === 'すべて' || ALL_THEMES[i].category === filter;

  function pool(){
    const p = [];
    for (let i = 0; i < ALL_THEMES.length; i++){
      if (inFilter(i) && !used.has(i)) p.push(i);
    }
    return p;
  }

  const total = () =>
    ALL_THEMES.filter((_, i) => inFilter(i)).length;

  function updateMeta(msg){
    const left = pool().length;
    metaEl.innerHTML = msg
      ? msg
      : `残りの話題 <em>${left}</em> ／ ${total()}`;
    drawBtn.disabled = drawing || left === 0;
    if (left === 0 && !drawing){
      metaEl.innerHTML = 'このカテゴリは出しきりました。別のカテゴリを選んでください';
    }
  }

  function paint(i){
    catEl.textContent = ALL_THEMES[i].category;
    themeEl.textContent = ALL_THEMES[i].text;
  }

  function renderHistory(){
    histEl.innerHTML = '';
    if (!history.length){
      histEl.innerHTML = '<li class="empty">まだ引いていません</li>';
      return;
    }
    history.forEach((i, n) => {
      const li = document.createElement('li');
      li.innerHTML =
        `<span class="no">${String(history.length - n).padStart(2,'0')}</span>` +
        `<span>${ALL_THEMES[i].text}</span>` +
        `<span class="tag" style="margin-left:auto">${ALL_THEMES[i].category}</span>`;
      histEl.appendChild(li);
    });
  }

  function draw(){
    const candidates = pool();
    if (!candidates.length || drawing) return;

    drawing = true;
    hasDrawn = true;
    drawBtn.disabled = true;
    drawBtn.textContent = '選んでいます';
    frame.classList.remove('is-settled');
    frame.classList.add('is-drawing');
    updateMeta('&nbsp;');

    const winner = candidates[Math.floor(Math.random() * candidates.length)];
    const start = performance.now();
    let nextAt = start;

    function tick(now){
      if (now >= nextAt){
        paint(candidates[Math.floor(Math.random() * candidates.length)]);
        const p = Math.min((now - start) / DURATION, 1);
        const eased = 1 - Math.pow(1 - p, 3);
        nextAt = now + FAST + (SLOW - FAST) * eased;
      }
      if (now - start < DURATION){
        requestAnimationFrame(tick);
      } else {
        finish(winner);
      }
    }
    requestAnimationFrame(tick);
  }

  function finish(i){
    used.add(i);
    history.unshift(i);
    if (history.length > 10) history.pop();
    paint(i);
    frame.classList.remove('is-drawing');
    void frame.offsetWidth;
    frame.classList.add('is-settled');
    drawing = false;
    drawBtn.textContent = 'もう一度引く';
    renderHistory();
    updateMeta();
  }

  drawBtn.addEventListener('click', draw);
  updateMeta();
})();
</script>
</body>
</html>
