# GitHub と連携すると、このファイルの設定でそのまま公開できます。
# ビルド工程はありません（index.html をそのまま配信します）。
[build]
  publish = "."
  command = ""

# 端末間で状態をそろえる同期API（/api/kuji）
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# 同期APIはキャッシュさせない
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
